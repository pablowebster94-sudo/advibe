name: Fix VentAds Vercel project

# The advibe-ai Vercel project must build the ventads-ai/ folder. If its
# Root Directory is changed (it was found building the AdVibe site at the
# repo root), this resets it to ventads-ai and redeploys production from the
# latest main commit. Needs the repository secret VERCEL_TOKEN (a Vercel
# token with access to the "advibe" team). Never prints the token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_D4RH2PCtzqCyaPnBVTBB12ba
      PROJECT_ID: prj_biu3oGeTQdWUoNK2AL5RHDPECofY
    steps:
      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not set."
            exit 1
          fi

      - name: Current project settings
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID" \
            | python3 -c 'import sys,json;p=json.load(sys.stdin);print("error:",p["error"]) if "error" in p else print("name:",p.get("name"),"| rootDirectory:",p.get("rootDirectory"),"| framework:",p.get("framework"))'

      - name: Set Root Directory to ventads-ai
        run: |
          curl -sS -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"rootDirectory":"ventads-ai","framework":"nextjs"}' \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID" \
            | python3 -c 'import sys,json;p=json.load(sys.stdin);
          if "error" in p: print("::error::",p["error"]); sys.exit(1)
          print("rootDirectory now:",p.get("rootDirectory"))'

      - name: Redeploy production from main
        run: |
          sha=$(curl -sS "https://api.github.com/repos/${{ github.repository }}/commits/main" | python3 -c 'import sys,json;print(json.load(sys.stdin)["sha"])')
          echo "main: $sha"
          body=$(python3 -c 'import json,sys;print(json.dumps({"name":"advibe-ai","project":sys.argv[1],"target":"production","gitSource":{"type":"github","org":"pablowebster94-sudo","repo":"advibe","ref":"main","sha":sys.argv[2]}}))' "$PROJECT_ID" "$sha")
          curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d "$body" "https://api.vercel.com/v13/deployments?teamId=$TEAM_ID&forceNew=1" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);
          if "error" in d: print("::error::",d["error"]); sys.exit(1)
          print("deployment:",d.get("id"),d.get("url"),d.get("readyState"))'
