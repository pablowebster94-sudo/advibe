name: Verify VentAds production

# Runs automatically when Vercel reports a successful deployment (Vercel's
# GitHub integration publishes GitHub Deployments), and on demand.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Production URL to verify"
        required: false
        default: "https://advibe-ai-six.vercel.app"
      e2e:
        description: "Also run the full generation flow (creates a [QA] product and campaign)"
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  verify:
    # Only the advibe-ai project's Production deployments (the repo also
    # deploys the AdVibe site as the "advibe" Vercel project).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production') &&
       contains(github.event.deployment.environment, 'advibe-ai'))
    runs-on: ubuntu-latest
    env:
      APP: ${{ github.event.inputs.url || 'https://advibe-ai-six.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (test fixtures)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ventads-ai/tests/fixtures

      - name: Vercel deployments for main
        shell: bash
        run: |
          sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "main HEAD: $sha"
          gh api "repos/${{ github.repository }}/deployments?sha=$sha&per_page=10" \
            --jq '.[] | "\(.environment) id=\(.id) creator=\(.creator.login)"' || true
          for id in $(gh api "repos/${{ github.repository }}/deployments?sha=$sha&per_page=10" --jq '.[].id'); do
            gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
              --jq '.[0] | "  -> \(.state) \(.environment_url // "") \(.description // "")"' || true
          done
          echo "Commit statuses:"
          gh api "repos/${{ github.repository }}/commits/$sha/status" \
            --jq '.statuses[] | "  \(.context): \(.state) \(.description // "")"' || true

      - name: Health (database, migrations, configuration)
        shell: bash
        run: |
          code=$(curl -sS -o health.json -w '%{http_code}' "$APP/api/health" || echo 000)
          echo "HTTP $code"
          cat health.json; echo
          [ "$code" = "200" ] || { echo "::error::/api/health is not healthy (HTTP $code). See the JSON above."; exit 1; }

      - name: Render is identical to local tests (fonts included)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          prod = json.load(open("health.json")).get("render", {}).get("fingerprint")
          pinned = json.load(open("ventads-ai/tests/fixtures/render-fingerprint.json"))["sha256"]
          print("production:", prod)
          print("pinned:    ", pinned)
          if prod != pinned:
              print("::error::Production renders the reference creative differently from local tests (fonts, sharp or renderer differ).")
              sys.exit(1)
          render = json.load(open("health.json")).get("render", {})
          pinned_tpl = json.load(open("ventads-ai/tests/fixtures/render-fingerprint.json")).get("templateSha256")
          if "templateFingerprint" in render or pinned_tpl:
              print("template production:", render.get("templateFingerprint"))
              print("template pinned:    ", pinned_tpl)
              if render.get("templateFingerprint") != pinned_tpl:
                  print("::error::Production renders the reference template ad differently from local tests.")
                  sys.exit(1)
          PY

      - name: Auth gate is configured (401, not 500)
        shell: bash
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$APP/")
          echo "GET / without credentials -> HTTP $code"
          [ "$code" = "401" ] || { echo "::error::Expected 401 from the auth gate, got $code."; exit 1; }

      - name: Login and dashboard
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Repository secret CRON_SECRET not set here; skipping the authenticated checks."
            exit 0
          fi
          for path in / /products /new /api/products; do
            code=$(curl -sS -u "advibe:$CRON_SECRET" -o /dev/null -w '%{http_code}' "$APP$path")
            echo "GET $path (authenticated) -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      # Drives the same API calls as the "Generar creatividades" button:
      # upload photo -> brand -> product -> POST /api/campaigns -> poll until
      # every creative is rendered. Prints status, content type and timing.
      - name: End-to-end generation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.e2e == 'true'
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is required for the end-to-end flow."
            exit 1
          fi
          auth=(-u "advibe:$CRON_SECRET")
          json=(-H "Content-Type: application/json")
          call() { # method path [body] -> prints status/type/time, body in out.json
            local extra=(); [ -n "${3:-}" ] && extra=(-d "$3")
            curl -sS "${auth[@]}" "${json[@]}" -X "$1" "${extra[@]}" -o out.json \
              -w "$1 $2 -> HTTP %{http_code} %{content_type} %{time_total}s\n" "$APP$2"
            if ! head -c1 out.json | grep -q '[{[]'; then
              echo "::error::$1 $2 did not return JSON:"; head -c 300 out.json; echo; exit 1
            fi
          }
          cp ventads-ai/tests/fixtures/vehicle.jpg photo.jpg
          failed=0
          code=$(curl -sS "${auth[@]}" -F "file=@photo.jpg;type=image/jpeg" -F folder=products \
            -o up.json -w '%{http_code} %{content_type} %{time_total}s' "$APP/api/uploads")
          echo "POST /api/uploads -> HTTP $code"
          if head -c1 up.json | grep -q '{'; then
            photo=$(python3 -c 'import json;print(json.load(open("up.json")).get("key",""))')
          else
            echo "::error::POST /api/uploads did not return JSON. Body starts with:"; head -c 400 up.json; echo
            photo=""; failed=1
          fi
          [ -n "$photo" ] || { echo "::warning::continuing without a product photo"; failed=1; }
          images=""; [ -n "$photo" ] && images='{"key":"'"$photo"'","role":"PRODUCT"}'
          call POST /api/brands '{"name":"[QA] AdVibe","defaultCta":"Escríbenos"}'
          brand=$(python3 -c 'import json;print(json.load(open("out.json"))["brand"]["id"])')
          call POST /api/products "{\"category\":\"vehiculos\",\"name\":\"[QA] C3\",\"manufacturer\":\"Citroën\",\"model\":\"Shine 1.2\",\"price\":18000,\"features\":\"Motor 1.2 PureTech\\nCaja automática\\nAros de 17 pulgadas\",\"benefits\":\"Bajo consumo de combustible\\nÚnico dueño\",\"brandId\":\"$brand\",\"images\":[$images]}"
          product=$(python3 -c 'import json;print(json.load(open("out.json"))["product"]["id"])')
          started=$(date +%s)
          call POST /api/campaigns "{\"productId\":\"$product\",\"objective\":\"VENDER\",\"style\":\"COMERCIAL\"}"
          python3 -c 'import json;d=json.load(open("out.json"));c=d.get("campaign");print("error:",d) if not c else print("providerStatus:",c["providerStatus"]);print("concepts:",[k["type"] for k in c["concepts"]]) if c else exit(1)'
          campaign=$(python3 -c 'import json;print(json.load(open("out.json"))["campaign"]["id"])')
          for i in $(seq 1 100); do
            state=$(curl -sS "${auth[@]}" "$APP/api/campaigns/$campaign" | python3 -c 'import sys,json;c=json.load(sys.stdin)["campaign"];cr=[x["status"] for k in c["concepts"] for x in k["creatives"]];print(c["status"],cr.count("COMPLETED"),len(cr),cr.count("FAILED"))')
            echo "poll $i: $state"
            case "$state" in READY*|FAILED*) break;; esac
            sleep 4
          done
          echo "campaign finished in $(( $(date +%s) - started ))s (from POST /api/campaigns to $state)"
          curl -sS "${auth[@]}" "$APP/api/campaigns/$campaign" | python3 -c 'import sys,json,collections;c=json.load(sys.stdin)["campaign"];cr=[x for k in c["concepts"] for x in k["creatives"]];print("image providers:",dict(collections.Counter(x["provider"] for x in cr)));[print("provider note:",n) for n in sorted({x["error"] for x in cr if x.get("error")})]'
          set -- $state
          [ "$1" = "READY" ] && [ "$2" = "$3" ] || { echo "::error::Campaign ended as: $state"; exit 1; }
          # Keep a few rendered creatives from production for visual review.
          mkdir -p creatives
          curl -sS "${auth[@]}" "$APP/api/campaigns/$campaign" | python3 -c 'import sys,json;c=json.load(sys.stdin)["campaign"];[print(k["type"]+"-"+x["format"], x["imageUrl"]) for k in c["concepts"] for x in k["creatives"] if x["imageUrl"]]' > creatives/urls.txt
          while read -r name url; do
            curl -sS "${auth[@]}" -o "creatives/$name.${url##*.}" -w "GET creative $name -> HTTP %{http_code} %{content_type}\n" "$APP$url"
            # Exact Meta sizes per format.
            case "$name" in
              *SQUARE_1_1) want=1080x1080;; *PORTRAIT_4_5) want=1080x1350;; *STORY_9_16) want=1080x1920;; *) want="";;
            esac
            got=$(file -b "creatives/$name.${url##*.}" | grep -oE '[0-9]+x[0-9]+' | tail -1)
            echo "  size $got (expected $want)"
            [ -z "$want" ] || [ "$got" = "$want" ] || { echo "::error::$name is $got, expected $want"; failed=1; }
          done < creatives/urls.txt
          # Private files: unauthenticated access must be refused.
          first=$(head -1 creatives/urls.txt | cut -d' ' -f2)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$APP$first")
          echo "GET creative without credentials -> HTTP $code"
          [ "$code" = "401" ] || { echo "::error::Creative files must require authentication (got $code)"; failed=1; }
          # Template campaign ("Póster de marca"): Brand Kit + exact content
          # rendered by VentAds over the original photo, 3 concepts x 3 formats.
          call POST /api/brands '{"name":"[QA] Muebles","contactPhone":"099 000 0000","footerNote":"Envío a todo el país","colors":["#0b5d2e","#c9a227"]}'
          tbrand=$(python3 -c 'import json;print(json.load(open("out.json"))["brand"]["id"])')
          call POST /api/products "{\"category\":\"Productos de retail\",\"name\":\"[QA] Juego de sala\",\"adTitle\":\"Juego de sala\\nImperial\",\"price\":1299,\"includes\":\"Sofá triple\\nSofá doble\\n2 poltronas\\nMesa de centro\",\"benefits\":\"Madera de alta calidad\\nTapizado antifluido\",\"promotions\":[{\"value\":\"15%\",\"label\":\"de descuento\",\"detail\":\"En toda la tienda\"}],\"brandId\":\"$tbrand\",\"images\":[$images]}"
          tproduct=$(python3 -c 'import json;print(json.load(open("out.json"))["product"]["id"])')
          call POST /api/campaigns "{\"productId\":\"$tproduct\",\"objective\":\"VENDER\",\"style\":\"COMERCIAL\",\"templateId\":\"poster-elegante\"}"
          tcampaign=$(python3 -c 'import json;print(json.load(open("out.json"))["campaign"]["id"])')
          for i in $(seq 1 60); do
            tstate=$(curl -sS -m 30 "${auth[@]}" "$APP/api/campaigns/$tcampaign" | python3 -c 'import sys,json;c=json.load(sys.stdin)["campaign"];cr=[x["status"] for k in c["concepts"] for x in k["creatives"]];print(c["status"],cr.count("COMPLETED"),len(cr),cr.count("FAILED"))')
            echo "template poll $i: $tstate"
            case "$tstate" in READY*|FAILED*) break;; esac
            sleep 4
          done
          curl -sS "${auth[@]}" "$APP/api/campaigns/$tcampaign" | python3 -c 'import sys,json,collections;c=json.load(sys.stdin)["campaign"];cr=[x for k in c["concepts"] for x in k["creatives"]];print("template providers:",dict(collections.Counter(x["provider"] for x in cr)));[print("template note:",n) for n in sorted({x["error"] for x in cr if x.get("error")})]'
          set -- $tstate
          [ "$1" = "READY" ] && [ "$2" = "$3" ] || { echo "::error::Template campaign ended as: $tstate"; failed=1; }
          curl -sS "${auth[@]}" "$APP/api/campaigns/$tcampaign" | python3 -c 'import sys,json;c=json.load(sys.stdin)["campaign"];[print("TEMPLATE_"+k["type"]+"-"+x["format"], x["imageUrl"]) for k in c["concepts"] for x in k["creatives"] if x["imageUrl"]]' >> creatives/urls-template.txt
          while read -r name url; do
            curl -sS "${auth[@]}" -o "creatives/$name.${url##*.}" -w "GET creative $name -> HTTP %{http_code} %{content_type}\n" "$APP$url"
          done < creatives/urls-template.txt

          code=$(curl -sS "${auth[@]}" -o /dev/null -w '%{http_code}' "$APP/results/$campaign")
          echo "GET /results/$campaign -> HTTP $code"
          [ "$code" = "200" ] || failed=1
          [ "$failed" = "0" ] || { echo "::error::End-to-end flow had failures (see above)."; exit 1; }

      - name: Upload rendered creatives
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-creatives
          path: |
            creatives/*.png
            creatives/*.jpg
          if-no-files-found: ignore
          retention-days: 7
