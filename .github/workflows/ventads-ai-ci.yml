name: ventADS AI CI

on:
  pull_request:
    paths:
      - "ventads-ai/**"
      - ".github/workflows/ventads-ai-ci.yml"
  push:
    branches:
      - main
      - "feature/advibe-ai-integration"
    paths:
      - "ventads-ai/**"
      - ".github/workflows/ventads-ai-ci.yml"

permissions:
  contents: read

concurrency:
  group: ventads-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ventads_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ventads_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ventads-ai
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ventads_ci?schema=ventads
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ventads_test?schema=ventads
      CRON_SECRET: ci-only-secret-not-for-production
      APP_URL: http://localhost:3000
      IMAGE_PROVIDER: local-compositor
      COPY_PROVIDER: template
      STORAGE_PROVIDER: database
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventads-ai/package-lock.json
      - name: Create isolated test database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres ventads_test
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
