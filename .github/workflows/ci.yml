name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Lint root app
        run: npm run lint

      - name: Build root app
        run: npm run build

      - name: Install ventADS dependencies
        working-directory: ventads-ai
        run: npm ci

      - name: Lint ventADS
        working-directory: ventads-ai
        run: npm run lint

      - name: Build ventADS
        working-directory: ventads-ai
        run: npm run build
