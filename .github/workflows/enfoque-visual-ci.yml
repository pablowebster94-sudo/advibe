name: Enfoque Visual CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint (Enfoque Visual)
        run: npx eslint app/enfoque-visual components/enfoque lib/enfoque-*.ts app/api/enfoque middleware.ts tests/enfoque.test.ts tests/e2e/enfoque*.mjs
      - run: npm test
      - run: npm run build
