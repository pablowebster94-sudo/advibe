name: VentAds production debug

# Read-only: GETs one authenticated VentAds API path and prints the HTTP
# status and the start of the body, to diagnose production without access
# to Vercel's logs. Never prints secrets.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "API path, e.g. /api/campaigns/<id>"
        required: true
      url:
        description: "Base URL"
        required: false
        default: "https://advibe-ai-six.vercel.app"

permissions:
  contents: read

jobs:
  get:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP: ${{ github.event.inputs.url }}
      P: ${{ github.event.inputs.path }}
    steps:
      - name: GET
        run: |
          case "$P" in /api/*) ;; *) echo "::error::path must start with /api/"; exit 1;; esac
          # Shortcut: the latest "[QA] Juego de sala" template campaign.
          if [ "$P" = "/api/qa-template-latest" ]; then
            pid=$(curl -sS -m 60 -u "advibe:$CRON_SECRET" "$APP/api/products" | python3 -c 'import sys,json;ps=[p for p in json.load(sys.stdin)["products"] if p["name"].startswith("[QA] Juego de sala")];print(ps[0]["id"] if ps else "")')
            cid=$(curl -sS -m 60 -u "advibe:$CRON_SECRET" "$APP/api/products/$pid" | python3 -c 'import sys,json;d=json.load(sys.stdin);p=d.get("product",d);print(p["campaigns"][0]["id"])')
            echo "product $pid campaign $cid"
            P="/api/campaigns/$cid"
          fi
          code=$(curl -sS -m 60 -u "advibe:$CRON_SECRET" -o body.txt -w '%{http_code} %{time_total}s' "$APP$P")
          echo "GET $P -> HTTP $code"
          python3 - <<'PY'
          import json
          raw = open("body.txt").read()
          try:
              d = json.loads(raw)
          except Exception:
              print(raw[:1500]); raise SystemExit
          c = d.get("campaign")
          if not c:
              print(json.dumps(d, ensure_ascii=False)[:1500]); raise SystemExit
          print("campaign", c.get("status"), "template", c.get("templateId"))
          for k in c.get("concepts", []):
              for x in k.get("creatives", []):
                  print(k["type"], x["format"], x["status"], "attempts", x.get("attempts"), "provider", x.get("provider"), "|", (x.get("error") or "")[:300])
          PY
