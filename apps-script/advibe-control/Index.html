<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADvibe CONTROL</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif}</style></head>
<body class="bg-slate-950 text-white min-h-screen">
<div class="max-w-3xl mx-auto min-h-screen flex flex-col">
<header class="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-950/95">
<div><div class="font-black text-lg">ADvibe CONTROL</div><div class="text-xs text-slate-400">Asistente operativo</div></div>
<button onclick="loadDash()" class="text-xs px-3 py-2 rounded-lg bg-slate-800">Dashboard</button>
</header>
<section id="dash" class="hidden p-4 grid grid-cols-2 gap-3"></section>
<nav class="px-4 pt-3 flex gap-2 overflow-x-auto text-xs">
<button onclick="quick('¿Qué tengo hoy?')" class="shrink-0 px-3 py-2 rounded-full bg-slate-800">Hoy</button>
<button onclick="quick('¿Qué tengo mañana?')" class="shrink-0 px-3 py-2 rounded-full bg-slate-800">Mañana</button>
<button onclick="quick('¿Qué tengo esta semana?')" class="shrink-0 px-3 py-2 rounded-full bg-slate-800">Semana</button>
</nav>
<main id="chat" class="flex-1 p-4 space-y-3 overflow-y-auto">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm">Hola. Soy ADvibe AI. Puedes decirme: “Hoy hice 2 videos para Muebles Ideal”, “¿Cuántos videos lleva Paola?”, “Grabar con Kamauto el martes a las 3 de la tarde” o “¿Qué tengo esta semana?”</div>
</main>
<footer class="p-4 border-t border-slate-800 sticky bottom-0 bg-slate-950">
<form onsubmit="send(event)" class="flex gap-2">
<button type="button" onclick="voice()" class="w-12 h-12 rounded-xl bg-slate-800">🎤</button>
<input id="p" class="flex-1 min-w-0 rounded-xl bg-slate-900 border border-slate-700 px-4" placeholder="Escribe o habla...">
<button class="w-12 h-12 rounded-xl bg-blue-600">➤</button>
</form></footer></div>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function add(who,msg){let d=document.createElement('div');d.className=who==='me'?'text-right':'text-left';d.innerHTML='<div class="inline-block max-w-[90%] rounded-2xl px-4 py-3 whitespace-pre-wrap '+(who==='me'?'bg-blue-600':'bg-slate-900 border border-slate-800')+'">'+esc(msg)+'</div>';document.getElementById('chat').appendChild(d);d.scrollIntoView()}
function send(e){e.preventDefault();let i=document.getElementById('p'),v=i.value.trim();if(!v)return;i.value='';add('me',v);google.script.run.withSuccessHandler(r=>add('ai',r.message||JSON.stringify(r))).withFailureHandler(e=>add('ai','⚠️ '+e.message)).processNaturalLanguage(v,'')}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Reconocimiento de voz no disponible en este navegador.');return}const r=new R();r.lang='es-EC';r.continuous=false;r.onresult=e=>{document.getElementById('p').value=e.results[0][0].transcript;send(new Event('submit'))};r.start()}
const LABELS={active:'Clientes activos',done:'Piezas hechas',pending:'Piezas pendientes',projected:'Cobros proyectados',paid:'Cobrado',balance:'Saldo por cobrar',tasks:'Tareas pendientes'};
function loadDash(){google.script.run.withSuccessHandler(d=>{let el=document.getElementById('dash');el.classList.remove('hidden');el.innerHTML=Object.entries(d).map(([k,v])=>`<div class="rounded-xl bg-slate-900 p-4"><div class="text-xs text-slate-400">${esc(LABELS[k]||k)}</div><div class="text-2xl font-bold">${esc(v)}</div></div>`).join('')}).withFailureHandler(e=>add('ai','⚠️ '+e.message)).getDashboardData()}
function quick(t){document.getElementById('p').value=t;send(new Event('submit'))}
</script></body></html>
